const DESC={"V24": "원경왕후의 친정인 민씨 집안에 사람과 재물이 몰린다. 대접하면 든든한 힘이 되지만, 외척은 커질수록 왕을 위협한다. (가상 사건)","S1": "1383년(우왕 9), 이방원은 고려의 문과에 병과 7위로 급제했다. 무장 가문인 이성계 집안에서 나온 드문 문과 급제자로, 아버지 이성계가 크게 기뻐했다고 전한다.", "S2": "1388년 요동 정벌에 나선 이성계는 위화도에서 군사를 돌려 개경을 장악했다. 이때 개경에 있던 이방원은 어머니 한씨와 계모 강씨, 어린 동생들을 이끌고 몸을 피해 가족을 지켰다.", "S3": "1389년 이성계 세력은 우왕과 창왕이 왕씨가 아니라 신돈의 자손이라며 창왕을 폐하고 공양왕을 세웠다(폐가입진). 이로써 고려 조정의 실권은 이성계 쪽으로 넘어갔다.", "S4": "1392년 이성계가 낙마해 몸져눕자 정몽주가 이성계 세력을 몰아내려 했다. 이방원은 부하를 시켜 정몽주를 살해했다. 선죽교에서 죽었다는 이야기, 하여가와 단심가를 주고받았다는 이야기는 전승이다.", "S5": "1392년 7월, 이성계는 신하들의 추대를 받아 개경 수창궁에서 즉위했다. 이듬해 명의 승인을 얻어 나라 이름을 조선으로 정했다.", "S6": "1392년 8월, 태조는 신덕왕후 강씨가 낳은 막내 방석을 세자로 세웠다. 건국에 공이 컸던 신의왕후 한씨의 아들들, 특히 이방원은 크게 실망했다.", "S7": "1392년 개국공신을 정할 때 왕자들은 명단에서 빠졌다. 이방원은 정안군에 봉해졌지만 선왕의 능을 돌보거나 지방을 살피는 등 중앙 권력에서 밀려났다.", "S8": "1394년 명이 왕자를 보내라고 요구하자 이방원이 사신으로 남경에 가서 홍무제를 만나 명의 의심을 풀었다. 가는 길에 훗날 영락제가 되는 연왕을 만났다는 이야기도 전한다.", "S9": "1396년 태조의 둘째 부인이자 세자 방석의 어머니인 신덕왕후 강씨가 세상을 떠났다. 태조는 깊이 슬퍼했고, 세자를 지켜 주던 큰 힘이 사라졌다.", "S10": "1398년 정도전은 요동 정벌을 내세워 진도 훈련을 시키고 왕자와 공신의 사병을 거두려 했다. 태조는 병석에 있었고, 군사를 잃을 위기에 놓인 이방원은 결단을 앞두었다.", "SV1": "개혁을 바라는 신진 사대부들이 모여 고려의 앞날을 논한다. 그들의 붓은 언젠가 칼보다 무거워질 것이다. (가상 사건)", "SV2": "넓은 토지를 차지한 권문세족들이 떠오르는 이성계 집안을 견제하며 조정에서 공격한다. 맞서 싸울지 달랠지 정해야 한다. (가상 사건)", "SV3": "고려 말 왜구는 해안뿐 아니라 내륙까지 쳐들어왔다. 이성계 집안의 군사가 출정해 이름을 떨칠 기회다. (가상 사건)", "SV4": "난세에 집안을 지키려면 자기 군사가 있어야 한다. 이방원은 따르는 무사들을 모아 사병을 키운다. (가상 사건)", "16": "1398년 제1차 왕자의 난 뒤 공을 세운 사람들을 정사공신으로 책록했다. 이방원과 그 측근들이 공신이 되어 실권을 쥐었다.", "17": "1399년 정종은 피비린내 나는 한양을 떠나 옛 도읍 개경으로 돌아갔다. 한양 재천도는 태종 때인 1405년에 이루어진다.", "18": "제2차 왕자의 난 직후인 1400년 2월, 정종은 아들이 아닌 동생 이방원을 세자로 세웠다. 같은 해 11월 이방원은 왕위에 올랐다.", "19": "1400년 4월, 고려의 도평의사사를 의정부로 고치고 군사권을 분리했다. 사병 혁파와 함께 왕권 중심 체제를 세우는 바탕이 되었다.", "V13": "왕자의 난 뒤 도성에는 형제의 피를 본 정안군을 두고 흉흉한 소문이 돈다. 백성의 마음을 붙잡아야 한다. (가상 사건)", "V14": "세자 방석과 방번을 잃은 태상왕 태조는 이방원에게 크게 노했다. 아버지의 노여움은 곧 정통성의 그림자가 된다. (가상 사건)", "V15": "넷째 형 방간 쪽 사람들이 정안군에게 줄을 대려 한다. 포섭하면 힘이 되지만, 언제 등을 돌릴지 모른다. (가상 사건)", "V16": "사헌부가 공신들이 토지와 노비를 빼앗는다며 탄핵 상소를 올렸다. 공신을 지킬지, 법을 세울지 정해야 한다. (가상 사건)", "20": "1401년 태종은 제2차 왕자의 난과 즉위에 공을 세운 이들을 좌명공신으로 책록했다. 하륜, 이숙번 등이 이름을 올렸다.", "21": "1401년 사섬서를 두고 이듬해 1402년 종이 화폐 저화를 발행했다. 백성들이 쌀과 베를 더 믿어 유통은 순조롭지 않았다.", "22": "1402년(태종 2) 정월, 조선에서 처음으로 정식 무과가 시행되었다. 사병 대신 나라가 무인을 길러 쓰는 길이 열렸다.", "23": "1403년 주자소를 설치하고 구리 활자 계미자를 만들었다. 책을 널리 찍어 유학을 퍼뜨리려는 뜻이었다.", "24": "태종은 1405년 도읍을 다시 한양으로 옮기고 새 궁궐 창덕궁을 지었다. 이후 한양은 조선의 도읍으로 굳어졌다.", "25": "1413년 지방 행정 구역의 이름과 체계를 고쳤고, 1417년 황해도·함경도로 개칭하며 8도 체제가 자리 잡았다. 왕이 지방을 직접 다스리는 틀이 마련되었다.", "26": "『태종실록』에 따르면 1413년 태종은 임진나루에서 거북선과 왜선이 싸우는 모습을 구경했다. 1415년에는 거북선을 더 튼튼하게 만들자는 건의가 올라왔다.", "27": "1414년, 양인 아버지와 노비 어머니 사이의 자식을 아버지 신분을 따라 양인으로 삼는 종부법을 시행했다. 나라의 역을 질 양인을 늘리려는 정책이었다.", "28": "1415년 서선이 종친과 관리들의 서얼 자손에게 높은 벼슬을 주지 말자고 건의했다. 이는 훗날 서얼을 차별하는 법의 출발점이 되었다.", "29": "민무구·민무질에 이어 1415년 남은 처남 민무휼·민무회도 불충을 이유로 서인이 되었고, 이듬해 1416년 사사되었다. 외척의 힘은 크게 꺾였다.", "30": "왕자의 난의 공신 이숙번은 공을 믿고 교만해졌다. 태종은 1415년 그를 조정에서 내쫓아 지방으로 보냈다.", "31": "1419년(세종 1), 상왕 태종의 주도로 이종무가 이끄는 군대가 왜구의 근거지 대마도를 쳤다(기해동정). 왕위를 물려준 뒤에도 군사권은 상왕에게 있었다.", "V17": "도성에 역병이 돌아 사람들이 쓰러진다. 약과 의원을 보낼지, 성문을 닫아 번지는 것을 막을지 정해야 한다. (가상 사건)", "V18": "도성에 큰불이 나 민가 수백 채가 탔다. 집 잃은 백성을 돌보지 않으면 원망이 왕에게 향한다. (가상 사건)", "V19": "어느 고을 수령이 세금을 가로채고 백성을 괴롭힌다는 고발이 올라왔다. 그는 공신의 친척이다. (가상 사건)", "V20": "왕자의 혼인은 곧 정치다. 어느 집안과 사돈을 맺느냐에 따라 조정의 힘이 바뀐다. (가상 사건)", "V21": "명 사신이 와서 머문다. 접대가 소홀하면 황제에게 나쁜 말이 들어가고, 지나치면 나라 곳간이 빈다. (가상 사건)", "V22": "여진 부족들이 말과 모피를 곡식과 바꾸자며 국경 시장을 열어 달라고 한다. 교역은 이익이지만 국경을 느슨하게 한다. (가상 사건)", "V23": "왕이 사냥 중 말에서 떨어지고는 사관에게 알리지 말라 했다는 이야기처럼, 사관은 왕의 일거수일투족을 적는다. 기록을 막으려 하면 신하들이 반발한다. (가상 사건)","1": "1398년, 정도전·남은 등이 요동 정벌을 내세워 왕자들의 사병을 거두려 하고 세자 방석을 앞세웠다. 이방원은 먼저 군사를 일으켜 정도전 일파와 세자 방석·방번을 제거했다.", "2": "난을 일으킨 직후 이방원은 스스로 세자가 되지 않고 둘째 형 방과를 세자로 세웠다. 태조가 물러나자 방과가 즉위하니 그가 정종이다. 실권은 여전히 정안군에게 있었다.", "3": "1400년, 넷째 형 방간이 박포의 부추김을 받아 개경에서 군사를 일으켰다. 이방원의 군사가 이를 진압했고, 방간은 죽이지 않고 유배를 보냈다.", "4": "제2차 왕자의 난 직후 1400년, 종친과 공신이 거느리던 사병을 모두 혁파해 삼군부에 귀속시켰다. 사사로운 무력이 사라지며 왕권의 바탕이 마련되었다.", "5": "1400년 11월, 정종이 동생 이방원에게 왕위를 물려주니 조선 제3대 국왕 태종이다. 피로 얻은 자리였기에 정통성을 다지는 일이 남았다.", "V1": "정도전 일파는 무너졌지만 그를 따르던 자들이 아직 도성에 숨어 있다는 소문이 돈다. 밀서가 오간다는 첩보를 어떻게 다룰지 정해야 한다. (가상 사건)", "V2": "왕자의 난에서 공을 세운 공신들이 더 큰 상과 벼슬을 바라고 있다. 달래자니 나라 곳간이, 누르자니 그들의 칼이 걱정이다. (가상 사건)", "V3": "정종은 왕위가 부담스러웠지만 쉽게 물러날 결심을 하지 못한다. 동생에게 선위할 명분과 시기를 놓고 조정이 술렁인다. (가상 사건)", "V4": "사병 혁파 명령이 내려졌지만 오랫동안 군사를 거느려 온 장수들이 쉽게 따르지 않는다. 회유할지 힘으로 누를지 정해야 한다. (가상 사건)", "T1": "무시해 둔 정도전 잔당이 무리를 모아 밤길에 습격을 벌였다. 지금이라도 막지 않으면 혼란이 번진다. (가상 토큰 사건)", "6": "태조는 왕자의 난 뒤 고향 함흥으로 떠나 돌아오지 않았다. 태종이 보낸 차사들이 돌아오지 못했다는 이야기는 전승이며, 태조는 1402년 무렵 한양으로 돌아왔다.", "7": "1402년, 안변부사 조사의가 신덕왕후 강씨의 원수를 갚는다며 동북면에서 군사를 일으켰다. 태상왕 태조와 연결되었다는 의심을 받았고, 관군이 진압했다.", "8": "1401년, 억울한 일을 당한 백성이 대궐 밖 북을 쳐 직접 왕에게 호소하도록 신문고를 설치했다. 실제로는 절차가 까다로워 널리 쓰이지는 못했다.", "9": "1403년, 명 영락제가 태종을 조선 국왕으로 인정하는 고명과 인신을 보내왔다. 대외적으로 왕위의 정당성이 확인된 순간이었다.", "10": "1406년, 전국의 사찰을 정리해 일부만 남기고 그 토지와 노비를 국가로 거두었다. 숭유억불을 실행하며 나라 재정을 넓혔다.", "11": "1406년 태종이 세자에게 왕위를 물려주겠다고 하자, 왕비의 동생 민무구·민무질이 기뻐한 기색을 보였다는 탄핵이 일어났다. 두 사람은 1407년 유배되었고, 1410년 사사되었다.", "12": "1413년, 16세 이상 남자에게 신분과 이름을 적은 호패를 차게 했다. 인구와 군역 자원을 파악하려는 제도였지만 백성의 반발과 도피도 컸다.", "13": "1414년, 6조가 의정부를 거치지 않고 왕에게 직접 보고하고 명을 받도록 했다. 재상의 권한이 줄고 왕권이 강해졌다.", "14": "세자 양녕대군의 잦은 비행 끝에 1418년 태종은 세자를 폐하고 셋째 충녕대군을 세자로 세웠다. 두 달 뒤 왕위를 물려주니 그가 세종이다.", "15": "세종이 즉위한 1418년, 상왕 태종은 세종의 장인 심온이 권세를 키울 것을 경계했다. 심온은 옥사에 연루되어 사사되었다.", "V5": "오랜 가뭄으로 곡식이 말라 백성이 굶주린다. 옛사람들은 하늘의 재앙을 임금의 덕과 연결해 보았다. (가상 사건)", "V6": "고려 말부터 이어진 왜구가 남쪽 해안을 노략질한다. 수군을 보내 바닷길을 지켜야 한다. (가상 사건 · 태종 대 왜구 침입은 실제로 잦았다)", "V7": "두만강 너머 여진 부족들이 국경을 넘어와 약탈과 교역을 오간다. 군사로 누를지 벼슬과 물자로 달랠지 정해야 한다. (가상 사건)", "V8": "명 사신이 금은과 공녀 등 무리한 공물을 요구한다. 들어주면 백성이 고달프고, 거절하면 황제의 의심을 산다. (가상 사건)", "V9": "사간원·사헌부의 대간들이 왕의 처사를 비판하는 상소를 잇달아 올린다. 받아들이면 시간이 들고, 묵살하면 신하들의 마음이 떠난다. (가상 사건)", "V10": "세자가 학문을 멀리하고 궐 밖에서 사냥과 유흥을 즐긴다는 보고가 올라온다. 꾸짖어 바로잡을지, 내버려 둘지 정해야 한다. (가상 사건)", "V11": "왕비 집안 민씨 형제의 집 앞에 벼슬을 사려는 자들이 줄을 섰다는 소문이 돈다. 외척의 힘이 커질수록 이런 일이 늘어난다. (가상 사건)", "V12": "누군가 밤중에 찾아와 역모를 고했다. 진짜인지 모함인지 알 수 없으니, 조사하든 바로 처단하든 대가가 따른다. (가상 사건)", "T2": "선위 파동 때 봐준 민씨 형제가 끝내 군사를 모았다. 외척의 칼이 왕실을 겨눈다. (가상 토큰 사건)", "T3": "요구를 거절당한 명 사신이 황제에게 조선을 비난하는 보고를 올렸다. 해명 사신을 보내야 한다. (가상 토큰 사건)"};
const PRO={"prologue": ["14세기 말, 고려는 안으로는 권문세족의 토지 독점과 불교 사원의 폐단, 밖으로는 홍건적과 왜구의 침입으로 무너져 가고 있었다. 전쟁 영웅으로 떠오른 이성계는 1388년 위화도에서 군사를 돌려 권력을 잡고, 신진 사대부와 손잡고 과전법 등 개혁을 밀어붙였다.", "1392년, 이성계는 왕위에 올라 새 왕조를 열었고 이듬해 국호를 조선으로 정했다. 새 나라의 설계자는 정도전이었다. 그는 재상이 중심이 되어 나라를 다스리는 정치를 꿈꾸며 한양 천도와 제도 정비를 이끌었다.", "같은 해, 태조는 첫째 부인 신의왕후 한씨의 아들들을 제치고 둘째 부인 신덕왕후 강씨가 낳은 막내 방석을 세자로 세웠다. 정몽주를 제거하는 등 건국에 큰 공을 세운 다섯째 아들 정안군 이방원은 개국공신에서도 빠지고 세자 자리에서도 밀려났다.", "1398년, 정도전은 요동 정벌을 내세워 왕자들과 공신들이 거느린 사병을 거두려 한다. 군사를 잃으면 정안군의 목숨도 장담할 수 없다. 태조는 병석에 누워 있고, 도성에는 긴장이 감돈다.", "당신은 이방원이다. 1383년 문과에 급제한 젊은 문신으로 시작해(서막), 먼저 칼을 뽑아 살아남고, 왕위에 올라 흔들리는 정통성을 바로 세우라. 그리고 공신·외척·종친·사대부의 힘을 다스려, 다음 왕에게 안정된 나라를 물려주어야 한다. 1418년 왕위를 넘기는 날, 역사가 당신을 평가할 것이다."], "act1": "1막 · 왕자의 난 (1398~1400) — 정도전과 세자 방석이 사병을 거두려 한다. 살아남아 형 방과(정종)를 세우고, 사병을 혁파한 뒤 마침내 즉위하라.", "act2": "2막 · 왕의 시대 (1400~1418) — 왕위에 올랐지만 아버지 태조는 등을 돌렸고, 공신과 외척은 커져만 간다. 명의 인정을 받고 제도를 다져, 세자 문제를 매듭짓고 다음 왕에게 나라를 물려주라.", "act0": "서막 · 고려의 황혼 (1383~1398) — 젊은 문신 이방원은 과거에 급제하고, 아버지 이성계의 곁에서 새 왕조가 열리는 것을 지켜본다. 공을 세우고도 밀려난 왕자는 1398년, 사병을 빼앗길 위기에 선다."};

국은 물론 일본, 아라비아, 아프리카와 유럽까지 담은 동아시아의 가장 오래된 세계 지도 가운데 하나다.", "Y7": "1404년 10월, 도읍을 정하지 못하자 태종은 종묘에서 송도·한양·무악을 두고 동전을 던졌다. 한양이 2길 1흉으로 나와 도읍이 확정되었고, 하륜이 주장한 무악은 밀려났다.", "Y8": "1406년 남번 조와국(자바) 사신 진언상 일행이 공작·앵무새·후추 등을 싣고 오다 군산 앞바다에서 왜구에게 약탈당했다. 살아남은 이들을 태종은 한양에 불러 후하게 대접했다.", "Y9": "1411년 일본 국왕이 코끼리를 바쳐 사복시에서 길렀다. 1412년 구경하던 전 공조전서 이우가 비웃고 침을 뱉다가 밟혀 죽자, 1413년 코끼리는 전라도 장도로 유배되었다.", "Y10": "태종 대 실록에는 일식 기록이 여러 번 나온다. 일식은 임금의 덕을 묻는 하늘의 경고로 여겨져, 왕은 소복을 입고 해를 구하는 구식(救食) 의례를 행했다.", "Y11": "함흥에서 돌아오는 태조를 맞을 때, 하륜의 말대로 차일에 큰 기둥을 세웠더니 태조가 쏜 화살이 기둥에 박혔다는 이야기가 전한다. 실록에 없는 야사다. (전설)", "Y12": "1412년 태종은 경복궁 서쪽에 연못을 넓게 파고 박자청에게 경회루를 크게 고쳐 짓게 했다. 명 사신을 맞고 잔치를 여는 나라의 누각이 되었다.", "N1": "1404년 2월, 태종이 노루를 쫓다 말이 넘어져 떨어졌으나 다치지 않았다. 그는 좌우에 '사관이 알게 하지 말라'고 했지만, 실록에는 그 말까지 그대로 적혔다.", "H1": "1402년 태종이 권홍의 딸을 후궁으로 맞으려 하자 원경왕후가 옷을 붙잡고 울며 음식을 끊었다. 태종은 가례를 거두고 조용히 별궁에 들였고, 부부 사이는 크게 벌어졌다.", "G1": "편전의 이야기가 밖으로 새어 나간다. 엿듣는 내관이 누구의 귀인지 가려내야 한다. (가상 사건)", "G2": "물러난 정종의 상왕전에서 선물이 왔다. 형의 뜻을 어떻게 받느냐에 따라 왕실의 화목이 정해진다. (가상 사건)", "G3": "명 사신이 조선의 매와 좋은 말을 탐낸다. 내주면 사신이 기뻐하지만, 그 말을 길러 낸 백성의 손해가 크다. (가상 사건)", "G4": "과거 합격자가 세도가의 자제로만 채워졌다는 소문이 돈다. 시험이 공정하지 않으면 선비들의 마음이 떠난다. (가상 사건)", "G5": "후궁이 늘면서 궁녀와 내관까지 편이 갈렸다. 다툼을 어떻게 다스리느냐가 중궁전의 마음을 가른다. (가상 사건)", "T4": "원경왕후와의 사이가 얼어붙자 궁중이 숨을 죽인다. 중궁전이 등을 돌리면 외척도 왕을 의심한다. (가상 토큰 사건)", "A1": "1416년 구종수·이오방 등이 몰래 동궁에 드나들며 세자와 놀고 여색을 바친 일이 드러났다. 이들은 유배되었고, 세자는 다시는 그러지 않겠다고 다짐했다.", "A2": "1417년 세자 양녕이 곽선의 첩 어리를 궁에 들인 일이 드러나 관련자들이 처형되었다. 1418년에는 다시 어리를 만난 사실이 밝혀져 장인 김한로가 유배되었다.", "A3": "1418년 5월, 꾸중을 들은 세자는 반성 대신 '전하의 시녀는 다 궁중에 들이면서 어찌 제 첩만 내보내느냐'며 따지는 글을 올렸다. 태종은 이 글을 신료들에게 보였고, 한 달 뒤 세자를 폐했다."});

function openRules(){M(`<h3>규칙 요약</h3><ol style="font-size:13px"><li>서막(3라운드, 행동 2) → 1막 → 2막. 서막 덱 7장, 마지막은 「요동 정벌과 사병 혁파 압박」</li><li>수입: 재정 +1, 원하는 자원 +1</li><li>세력 수입(3 이상): 공신→무력 · 사대부→명분 · 종친→인맥 · 외척→재정</li><li>종친 3+: 라운드마다 정통성 감소 1번 막음 · 종친 5+: 즉위·폐세자 정통성 조건 -1</li><li>세력 위험: 공신/외척 6 반란(정통성 -1), 종친 6 반목(후계 -1), 사대부 6 신권 견제(행동 -1), 어느 세력이든 0이면 정통성 -1</li><li>기술 효과(매 라운드)</li><li>악화: 지난 라운드 미해결 사건 → 악화 칸 (비용 +2)</li><li>공개: 2장(1라운드 3장) + 토큰</li><li>행동: 해결 또는 정무(자원 2개) (1막 3 / 즉위 후 4)</li><li>정리: 악화 칸 미해결 버림 → 민심 -1, 정통성 -2</li></ol>
<p style="font-size:13px"><b>v0.4</b> 빌런: 시대마다 하나(서막 정몽주 · 1막 정도전 · 2막 전반 태상왕 이성계 · 2막 후반 민무구·민무질). 살아 있는 동안 매 라운드 방해, 관련 사건을 해결하면 기세가 줄고, 0이면 쓰러짐(이성계는 화해). 쓰러뜨린 빌런마다 +1점.<br>
실록: 가혹한 선택(처단·처형·진압 등)은 사초에 남습니다. 인맥 1을 더 내면 숨길 수 있습니다(3번째에 사대부 -1). 숨기지 않은 가혹한 선택이 2 이하 +2점, 5 이상 -2점. 끝나면 실록을 볼 수 있습니다.<br>
원경왕후 관계(0~6, 시작 2): 함께한 초기 사건(위화도·왕자의 난·즉위)에 +1, 후궁 사건과 민씨 형제 처단에 하락. 5 이상이면 외척 사건 비용 -1, 1 이하로 떨어지면 궁중 사건 「중궁전의 냉기」.<br>
양녕 일화: 2막에서 세자의 비행이 2·3·4가 되면 「구종수의 담 넘기」(1416) → 「어리 사건」(1417~18) → 「세자의 상서」(1418)가 차례로 나옵니다.<br>
야사 카드(📜): 실록 일화와 전설(전설 표시). 칭호: 끝날 때 플레이 방식에 따라. 높은 점수 + 민심 5 이상이면 태종우 결말(전승).</p>
<p style="font-size:13px">교환(자유): 같은 자원 2 → 다른 자원 1. 패배: 민심 또는 정통성 0.<br>점수 = 후계 + 민심 + 정통성 + 진열대 카드 수 + 세력 균형(2~4 세력마다 +2, 넷 모두 +3 추가).<br>68+ 성군의 시대 · 61+ 안정된 계승 · 55+ 불안한 계승 · 그 미만 왕조의 위기.<br>즉위: 정통성 4↑, 버려지지 않음, 4라운드 이후 미해결 라운드 종료마다 정통성 -1. 폐세자: 정통성 5↑, 미해결 시 후계 -3. 함흥차사: 놓여 있는 동안 라운드 종료마다 정통성 -1.</p>`)}

 $("rowc").innerHTML=s.row.map(c=>cardHTML(c,false)).join("")||'<span class="note">없음</span>';
 $("worsec").innerHTML=s.worse.map(c=>cardHTML(c,true)).join("")||'<span class="note">없음</span>';

 s.newChars=[];
 $("tabn").textContent=s.tab.length;
 $("tabc").innerHTML=s.tab.map(id=>{const d=C[base(id)];if(!d.tech)return `<div class="tech" style="background:#fff">${d.t} <small>(기술 없음)</small></div>`;const n=d.tech[0],u=s.used[n];
