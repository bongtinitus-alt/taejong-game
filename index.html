function condText(c){const b=base(c.id);if(b=="5")return `정통성 ${4+S.v3fail} 이상 필요`;if(b=="14")return "정통성 5 이상 필요";if(b=="V4")return "「사병 혁파」 해결 필요";return ""}
const HARSH=["색출","처단","처형","진압","기습","위협","토벌","처벌"],LOW=["무시","방치","봐주기","덮어줌","두기","묵살"];
function resolve(u,oi,ex){const c=S.row.concat(S.worse).find(x=>x.u==u);if(!c||S.over)return;const e=effCost(c,oi);
 if(!canPay(e,ex)||!condOK(c)||(S.actLeft<1&&!S.free))return;snap();
 for(const x in e.k)S.res[x]-=e.k[x];if(e.extra)S.res[ex]-=e.extra;
 if(S.free)S.free--;else S.actLeft--;
 const b=base(c.id),d=C[b],o=d.o[oi];S.row=S.row.filter(x=>x.u!=u);S.worse=S.worse.filter(x=>x.u!=u);
 log(`해결: ${d.t} — ${o[0]} (${o[2]})`);
 let dice=null;for(const [k,v] of o[3]){if(k=="TOKEN"){if(!S.tokNext.includes(v)&&!S.row.concat(S.worse).some(x=>x.id==v)){S.tokNext.push(v);log("토큰 사건 추가(다음 라운드): "+C[v].t)}}
  else if(k=="ACTM")S.actMinus+=v;else if(k=="PYE")S.pye+=v;else if(k=="DICE")dice=v;else add(k,v)}
 for(const ch of CH){if(!chOn(ch.id,5))continue;
  if(ch.bon&&ch.cards.includes(b)){for(const [k,v] of ch.bon)add(k,v);log(`${ch.t}(5+): ${ch.bon.map(x=>x[0]+" +"+x[1]).join(", ")}`)}}
 if(b=="6"&&chOn("P6",5)){add("정통성",1);log("이화(종친5+): 정통성 +1")}
 if(b=="11"&&oi==0&&chOn("P5",5)){add("후계",1);log("민무구(외척5+): 후계 +1")}
 if(b=="14"&&oi==1&&chOn("P7",5)){add("후계",2);log("양녕대군(종친5+): 후계 +2")}
 if(b=="14"&&oi==0&&chOn("P8",5)){add("후계",2);log("충녕대군(종친5+): 후계 +2")}
 if(b=="14"&&oi==0&&chOn("P10",5)){add("사대부",-1);log("황희(사대부5+): 사대부 -1")}
 if(d.d!="토큰")S.tab.push(c.id);
 if(b=="5"){S.pendingAct2=true;log("즉위! 다음 라운드부터 2막");AU.sfx("fanfare")}
 else AU.sfx(HARSH.includes(o[0])?"harsh":LOW.includes(o[0])?"thud":"resolve");
 if(dice){S.dice={eff:dice,roll:1+rnd(6),opt:o[0]};AU.sfx("dice")}
 clamp();closeM();save();render();if(S.dice)showDice();}
function showDice(){const D=S.dice,real=D.roll<=3;M(`<h3>역모 고변 — ${D.opt}</h3><p style="font-size:40px;text-align:center">🎲 ${D.roll}</p><p>${real?"진짜 역모!":"모함이었다."}</p>
 <button class="btn pri" onclick="applyDice()">결과 적용</button>${avail("의금부 정비")?'<button class="btn alt" onclick="reroll()">의금부 정비: 다시 굴림</button>':""}`,true)}
function reroll(){S.used["의금부 정비"]=1;S.dice.roll=1+rnd(6);log("의금부 정비: 다시 굴림");AU.sfx("dice");showDice()}
function applyDice(){snap();const D=S.dice;const r=D.roll<=3;log(`주사위 ${D.roll}: ${r?"진짜":"모함"}`);for(const [k,v] of D.eff[r?0:1])add(k,v);S.dice=null;clamp();closeM();save();render()}
function jeongmu(r){if(S.actLeft<1||S.over)return;snap();S.actLeft--;S.res[r]++;log("정무: "+r+" +1");AU.sfx("click");closeM();save();render()}
function trade(a,b){if(S.res[a]<2||a==b)return;snap();S.res[a]-=2;S.res[b]++;log(`교환: ${a} 2 → ${b} 1`);AU.sfx("click");save();render();openTrade()}
function manual(k,v){snap();if(k=="round")S.round+=v;else if(k=="act")S.actLeft+=v;else add(k,v);if(k!="사대부")0;clamp();log(`수동 조정: ${k} ${v>0?"+":""}${v}`);save();render()}
/* ---------- UI ---------- */
const $=id=>document.getElementById(id);
function M(h,lock){$("mbox").innerHTML=h+(lock?"":'<button class="btn alt" style="width:100%" onclick="closeM()">닫기</button>');$("modal").classList.add("on")}
function closeM(){$("modal").classList.remove("on")}
$("modal").onclick=e=>{if(e.target.id=="modal"&&!S.dice)closeM()};
const chips=(k,ex)=>{const s=R.filter(r=>k[r]).map(r=>`<span class="chip c${r}">${r}${k[r]}</span>`).join("")+(ex?`<span class="chip cany">+${ex} 아무 자원</span>`:"");return s||'<span class="chip cany">없음</span>'};
function trk(lbl,val,k,cls=""){return `<span class="trk ${cls}">${lbl} <b>${val}</b><button class="pm" onclick="manual('${k}',-1)">−</button><button class="pm" onclick="manual('${k}',1)">+</button></span>`}
function cardHTML(c,w){const d=C[base(c.id)],[col,tint]=COL[d.d];const costs=d.cost?chips(d.cost):"선택지별";
 return `<div class="card ${w?"worse":""}" style="--c:${col};--t:${tint}" onclick="openCard(${c.u})" data-id="${c.id}">${w?'<span class="badge">악화 +1</span>':""}${c.hold?'<span class="badge" style="top:12px">보류</span>':""}
 <div class="ttl">${d.t}</div><small>${d.d} · ${d.k}${d.y?" "+d.y:""}</small><div>${costs}</div></div>`}
function openCard(u){const c=S.row.concat(S.worse).find(x=>x.u==u);const d=C[base(c.id)],[col,tint]=COL[d.d];const w=S.worse.some(x=>x.u==u);
 let h=`<div style="--c:${col};--t:${tint}"><div class="card" style="cursor:default"><div class="ttl">${d.t}</div><small>#${base(c.id)} · ${d.d} · ${d.k} ${d.y||""}</small>
 <p class="flav">${d.f}</p>${d.tags?`<small>분류: ${d.tags}</small>`:""}${d.cond?`<p><b>조건:</b> ${d.cond}</p>`:""}
 <p><b>비용:</b> ${d.cost?chips(d.cost):"선택지마다 다름"} ${w?"<b>(악화: +1 아무 자원)</b>":""}</p>${d.fail?`<p class="fail">${d.fail}</p>`:""}
 ${d.tech?`<div class="tech"><b>기술 · ${d.tech[0]}</b><br>${d.tech[1]}</div>`:""}</div>`;
 const ok=condOK(c);if(!ok)h+=`<p class="fail">조건 미충족: ${condText(c)}</p>`;
 const act=S.actLeft>0||S.free>0;if(!act)h+=`<p class="fail">남은 행동이 없습니다.</p>`;
 d.o.forEach((o,i)=>{const e=effCost(c,i);let exSel="";let ex=null;
  if(e.extra){const r2=Object.assign({},S.res);for(const x in e.k)r2[x]-=e.k[x];ex=R.filter(r=>r2[r]>=e.extra).sort((a,b)=>r2[b]-r2[a])[0]||"무력";
   exSel=`<div>추가 자원: <select id="ex${i}">${R.map(r=>`<option ${r==ex?"selected":""}>${r}</option>`).join("")}</select></div>`}
  const pay=canPay(e,ex);
  h+=`<div class="opt"><b>◆ ${o[0]}</b> — ${o[2]}<div>실제 비용: ${chips(e.k,e.extra)}</div>${e.notes.length?`<small>${e.notes.join(", ")}</small>`:""}${exSel}
  <button class="btn" data-opt="${i}" ${(!pay||!ok||!act||S.over)?"disabled":""} onclick="resolve(${u},${i},${e.extra?`$('ex${i}').value`:"null"})">${pay?"이 선택지로 해결":"자원 부족"}</button></div>`});
 if(w&&avail("물러서는 지혜")&&!["5","14"].includes(base(c.id))&&!c.hold)h+=`<button class="btn alt" onclick="hold(${u})">물러서는 지혜 사용 (1라운드 더 보류)</button>`;
 M(h+"</div>");AU.sfx("click")}
function hold(u){snap();const c=S.worse.find(x=>x.u==u);c.hold=true;S.used["물러서는 지혜"]=1;log("물러서는 지혜 사용: "+C[base(c.id)].t);save();closeM();render()}
function openJM(){M(`<h3>정무 — 원하는 자원 1개 (행동 1)</h3>`+R.map(r=>`<button class="btn" style="background:var(--${{무력:"mu",명분:"my",인맥:"in",재정:"je"}[r]})" onclick="jeongmu('${r}')">${r} +1</button>`).join(""))}
function openTrade(){let h="<h3>교환 (행동 아님): 같은 자원 2 → 다른 자원 1</h3>";for(const a of R){h+=`<div>${a}(${S.res[a]}) 2개 → `+R.filter(b=>b!=a).map(b=>`<button class="btn" ${S.res[a]<2?"disabled":""} onclick="trade('${a}','${b}')">${b}</button>`).join("")+"</div>"}M(h)}
function useTech(n){snap();if(n=="밀정의 귀"){S.used[n]=1;const dk=S.act==1?S.deck1:S.deck2;log("밀정의 귀 사용");save();render();M(`<h3>밀정의 귀</h3><p>덱 맨 위: <b>${dk[0]?C[base(dk[0])].t:"(없음)"}</b></p>`)}
 else if(n=="왕에게 곧바로"){S.used[n]=1;S.free++;log("왕에게 곧바로: 이번 해결 1회는 행동을 쓰지 않음 (행동 1로 2장)");save();render()}
 else if(n=="시험하는 왕"){U.pop();M("<h3>시험하는 왕: 세력 1칸 조정</h3>"+F.map(f=>`<div>${f} ${S.fac[f]} <button class="btn" onclick="sikum('${f}',-1)">−1</button><button class="btn" onclick="sikum('${f}',1)">+1</button></div>`).join(""))}}
function sikum(f,v){snap();S.used["시험하는 왕"]=1;S.fac[f]+=v;clamp();log(`시험하는 왕: ${f} ${v>0?"+":""}${v}`);save();closeM();render()}
function openAudio(){const c=AU.cfg;M(`<h3>소리 설정</h3>
<p>배경음악 <label><input type="checkbox" id="bm" ${c.bgmM?"checked":""}> 음소거</label><br><input type="range" id="bv" min="0" max="1" step="0.05" value="${c.bgmV}"></p>
<p>효과음 <label><input type="checkbox" id="sm" ${c.sfxM?"checked":""}> 음소거</label><br><input type="range" id="sv" min="0" max="1" step="0.05" value="${c.sfxV}"></p>`);
 const up=()=>{c.bgmM=$("bm").checked;c.bgmV=+$("bv").value;c.sfxM=$("sm").checked;c.sfxV=+$("sv").value;AU.save();if(AU.cur)AU.cur.volume=AU.vol()};
 ["bm","bv","sm","sv"].forEach(i=>$(i).oninput=up);$("sv").onchange=()=>AU.sfx("click")}
function openCredits(){M(`<h3>크레딧</h3><p><b>게임 디자인</b>: 《태종: 피로 세운 길》 프로토타입 v0.1</p>
<p><b>1막 BGM</b>: "Taiko drums (seamless loop)" — jobro (OpenGameArt 제출: congusbongus). 라이선스 <a href="https://creativecommons.org/licenses/by/3.0/">CC-BY 3.0</a>. 출처 <a href="https://opengameart.org/content/taiko-drums-seamless-loop">opengameart.org/content/taiko-drums-seamless-loop</a> (원본 freesound.org/people/jobro/sounds/112248). 96kbps MP3로 재인코딩.</p>
<p><b>2막 BGM</b>: "Asianoriental1" — Tozan. 라이선스 CC0. 출처 <a href="https://opengameart.org/content/asianoriental1">opengameart.org/content/asianoriental1</a>. 96kbps MP3로 재인코딩.</p>
<p><b>인물 카드</b>: 10장, 수치는 초안.</p><p><b>효과음</b>: numpy로 직접 합성 (sfxgen.py).</p>`)}
function openRules(){M(`<h3>규칙 요약</h3><ol style="font-size:13px"><li>수입: 재정 +1</li><li>세력 수입(3 이상): 공신→무력 · 사대부→명분 · 종친→인맥 · 외척→재정</li><li>반란: 공신/외척 6이면 정통성 -1</li><li>기술 효과(매 라운드)</li><li>악화: 지난 라운드 미해결 사건 → 악화 칸 (비용 +1)</li><li>공개: 2장(1라운드 3장) + 토큰</li><li>행동: 해결 또는 정무 (1막 2 / 즉위 후 3)</li><li>정리: 악화 칸 미해결 버림 → 민심 -1, 정통성 -1</li></ol>
<p style="font-size:13px">교환(자유): 같은 자원 2 → 다른 자원 1. 패배: 민심 또는 정통성 0.<br>점수 = 후계 + 민심 + 정통성 + 진열대 카드 수 + 세력 균형(2~4 세력마다 +1, 넷 모두 +2 추가).<br>35+ 성군의 시대 · 25+ 안정된 계승 · 15+ 불안한 계승 · 그 미만 왕조의 위기.<br>즉위: 정통성 4↑, 버려지지 않음, 4라운드 이후 미해결 라운드 종료마다 정통성 -1. 폐세자: 정통성 5↑, 미해결 시 후계 -3. 함흥차사: 놓여 있는 동안 라운드 종료마다 정통성 -1.</p>`)}
function render(){const s=S;document.body.style.background=s.act==1?"#efe3d9":"#e1e6ef";
 $("hdr").innerHTML=`<div class="row"><b style="color:${s.act==1?"#f2a3a3":"#a9c4f2"}">${s.act}막</b>${trk("라운드",s.round+"/12","round")}${trk("행동",s.actLeft+(s.free?`(+${s.free}무료)`:""),"act")}${trk("후계",s.후계,"후계")}${trk("민심",s.민심,"민심",s.민심<=2?"danger":"")}${trk("정통성",s.정통성,"정통성",s.정통성<=2?"danger":"")}</div>
 <div class="row" style="margin-top:3px">${R.map(r=>trk(r,s.res[r],r,"res c"+r)).join("")}</div><div class="row" style="margin-top:3px">${F.map(f=>trk(f,s.fac[f],f,s.fac[f]>=6?"danger":"")).join("")}</div>`;
 const dk=s.act==1?s.deck1:s.deck2;
 $("status").innerHTML=`<span class="note">덱 남은 장: ${dk.length}${s.act==1?` · 2막 덱 ${s.deck2.length}`:""}${has("백성의 목소리")?` · 백성의 목소리 — 다음 사건: <b>${dk[0]?C[base(dk[0])].t:"없음"}</b>`:""}${s.tokNext.length?` · 다음 라운드 토큰: ${s.tokNext.map(t=>C[t].t).join(", ")}`:""}${s.v3fail?` · 즉위 조건 +${s.v3fail}`:""}${s.pye?` · 충녕 책봉 비용 -${s.pye}`:""}${s.actMinus?` · 다음 라운드 행동 -${s.actMinus}`:""}${s.pendingAct2?" · <b>다음 라운드 2막</b>":""}</span>`;
 $("rowc").innerHTML=s.row.map(c=>cardHTML(c,false)).join("")||'<span class="note">없음</span>';
 $("worsec").innerHTML=s.worse.map(c=>cardHTML(c,true)).join("")||'<span class="note">없음</span>';
 $("chn").textContent=(s.chars||[]).length;
 $("chc").innerHTML=(s.chars||[]).map(id=>{const c=CH.find(x=>x.id==id),v=s.fac[c.f],nw=(s.newChars||[]).includes(id);
  return `<div class="card pc ${nw?"enter":""}" style="--c:#2F6F6A;--t:#ECF5F3;cursor:default" data-ch="${id}"><div class="ttl">${c.t}</div><small><span class="chip" style="background:${FC[c.f]}">${c.f} ${v}</span> ${c.fl}</small>
  <div class="${v>=3?"on":"off"}"><b>3+</b> ${c.e3}</div><div class="${v>=5?"on":"off"}"><b>5+</b> ${c.e5}</div></div>`}).join("")||'<span class="note">아직 없음</span>';
 s.newChars=[];
 $("tabn").textContent=s.tab.length;
 $("tabc").innerHTML=s.tab.map(id=>{const d=C[base(id)];if(!d.tech)return `<div class="tech" style="background:#fff">${d.t} <small>(기술 없음)</small></div>`;const n=d.tech[0],u=s.used[n];
  let b="";if(["밀정의 귀","왕에게 곧바로","시험하는 왕"].includes(n)&&!u)b=`<button class="btn" onclick="useTech('${n}')">사용</button>`;
  return `<div class="tech ${u?"used":""}"><b>${n}</b> <small>(${d.t})</small> ${AUTO[n]?'<span class="chip cany">자동</span>':'<span class="chip cany">수동</span>'}${ONCE[n]?(u?' <span class="chip cany">사용함</span>':' <span class="chip c재정">사용 가능</span>'):""}<br>${d.tech[1]}${b}</div>`}).join("")||'<span class="note">없음</span>';
 $("log").textContent=s.log.join("\n");
 const o=s.over;
 $("bar").innerHTML=o?`<button class="btn pri" onclick="showEnd()">결과 보기</button><button class="btn alt" onclick="openCredits()">크레딧</button><button class="btn alt" onclick="confirmNew()">새 게임</button>`:
 `<button class="btn" id="bJM" ${s.actLeft<1?"disabled":""} onclick="openJM()">정무</button><button class="btn" onclick="openTrade()">교환</button><button class="btn pri" id="bEnd" onclick="endRound()">라운드 종료</button><button class="btn alt" onclick="undo()" ${U.length?"":"disabled"}>되돌리기</button><button class="btn alt" onclick="document.body.classList.toggle('edit')">✎수정</button><button class="btn alt" onclick="openRules()">규칙</button><button class="btn alt" onclick="openAudio()">🔊</button><button class="btn alt" onclick="openCredits()">크레딧</button><button class="btn alt" onclick="confirmNew()">새 게임</button>`;
 if(o&&!$("modal").classList.contains("on"))showEnd();}
function showEnd(){const o=S.over;if(o.lose){M(`<h2>왕조의 몰락</h2><p>민심 또는 정통성이 0이 되었습니다. (라운드 ${S.round})</p><button class="btn pri" onclick="newGame();closeM()">새 게임</button>`);return}
 if(o.stage=="simon"){const d=C["15"];M(`<div class="card" style="--c:#3A2A12;--t:#F7F1E3;cursor:default"><div class="ttl">보너스 · ${d.t} (1418)</div><p class="flav">${d.f}</p><p>${d.cond}</p></div>
 <button class="btn pri" id="simY" onclick="simon(true)">사사 — 외척 0, 민심 -2</button><button class="btn alt" id="simN" onclick="simon(false)">두기 — 변화 없음</button>`,true);return}
 const sc=score();if(!o.snd){o.snd=1;AU.sfx(sc.tot>=25?"win":"lose")}
 M(`<h2>${sc.g}</h2><p>최종 점수 <b style="font-size:28px">${sc.tot}</b></p><p>후계 ${S.후계} + 민심 ${S.민심} + 정통성 ${S.정통성} + 진열대 ${S.tab.length} + 세력 균형 ${sc.b}</p><button class="btn pri" onclick="newGame();closeM()">새 게임</button>`)}
function confirmNew(){M(`<h3>새 게임을 시작할까요?</h3><p class="note">덱을 새로 섞습니다 (새 게임 = 새 순서).</p><button class="btn pri" id="newOK" onclick="newGame();closeM()">새 게임 시작</button>`)}
try{S=JSON.parse(localStorage.getItem("tj_save"));uidc=S.uid||999}catch(e){S=null}
if(!S||!S.res)newGame();else{S.chars=S.chars||[];render()}
</script></body></html>
