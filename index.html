const chOn=(id,l)=>{const c=CH.find(x=>x.id==id);return S.chars.includes(id)&&S.fac[c.f]>=l};
const DESC={"S1": "1383년(우왕 9), 이방원은 고려의 문과에 병과 7위로 급제했다. 무장 가문인 이성계 집안에서 나온 드문 문과 급제자로, 아버지 이성계가 크게 기뻐했다고 전한다.", "S2": "1388년 요동 정벌에 나선 이성계는 위화도에서 군사를 돌려 개경을 장악했다. 이때 개경에 있던 이방원은 어머니 한씨와 계모 강씨, 어린 동생들을 이끌고 몸을 피해 가족을 지켰다.", "S3": "1389년 이성계 세력은 우왕과 창왕이 왕씨가 아니라 신돈의 자손이라며 창왕을 폐하고 공양왕을 세웠다(폐가입진). 이로써 고려 조정의 실권은 이성계 쪽으로 넘어갔다.", "S4": "1392년 이성계가 낙마해 몸져눕자 정몽주가 이성계 세력을 몰아내려 했다. 이방원은 부하를 시켜 정몽주를 살해했다. 선죽교에서 죽었다는 이야기, 하여가와 단심가를 주고받았다는 이야기는 전승이다.", "S5": "1392년 7월, 이성계는 신하들의 추대를 받아 개경 수창궁에서 즉위했다. 이듬해 명의 승인을 얻어 나라 이름을 조선으로 정했다.", "S6": "1392년 8월, 태조는 신덕왕후 강씨가 낳은 막내 방석을 세자로 세웠다. 건국에 공이 컸던 신의왕후 한씨의 아들들, 특히 이방원은 크게 실망했다.", "S7": "1392년 개국공신을 정할 때 왕자들은 명단에서 빠졌다. 이방원은 정안군에 봉해졌지만 선왕의 능을 돌보거나 지방을 살피는 등 중앙 권력에서 밀려났다.", "S8": "1394년 명이 왕자를 보내라고 요구하자 이방원이 사신으로 남경에 가서 홍무제를 만나 명의 의심을 풀었다. 가는 길에 훗날 영락제가 되는 연왕을 만났다는 이야기도 전한다.", "S9": "1396년 태조의 둘째 부인이자 세자 방석의 어머니인 신덕왕후 강씨가 세상을 떠났다. 태조는 깊이 슬퍼했고, 세자를 지켜 주던 큰 힘이 사라졌다.", "S10": "1398년 정도전은 요동 정벌을 내세워 진도 훈련을 시키고 왕자와 공신의 사병을 거두려 했다. 태조는 병석에 있었고, 군사를 잃을 위기에 놓인 이방원은 결단을 앞두었다.", "SV1": "개혁을 바라는 신진 사대부들이 모여 고려의 앞날을 논한다. 그들의 붓은 언젠가 칼보다 무거워질 것이다. (가상 사건)", "SV2": "넓은 토지를 차지한 권문세족들이 떠오르는 이성계 집안을 견제하며 조정에서 공격한다. 맞서 싸울지 달랠지 정해야 한다. (가상 사건)", "SV3": "고려 말 왜구는 해안뿐 아니라 내륙까지 쳐들어왔다. 이성계 집안의 군사가 출정해 이름을 떨칠 기회다. (가상 사건)", "SV4": "난세에 집안을 지키려면 자기 군사가 있어야 한다. 이방원은 따르는 무사들을 모아 사병을 키운다. (가상 사건)", "16": "1398년 제1차 왕자의 난 뒤 공을 세운 사람들을 정사공신으로 책록했다. 이방원과 그 측근들이 공신이 되어 실권을 쥐었다.", "17": "1399년 정종은 피비린내 나는 한양을 떠나 옛 도읍 개경으로 돌아갔다. 한양 재천도는 태종 때인 1405년에 이루어진다.", "18": "제2차 왕자의 난 직후인 1400년 2월, 정종은 아들이 아닌 동생 이방원을 세자로 세웠다. 같은 해 11월 이방원은 왕위에 올랐다.", "19": "1400년 4월, 고려의 도평의사사를 의정부로 고치고 군사권을 분리했다. 사병 혁파와 함께 왕권 중심 체제를 세우는 바탕이 되었다.", "V13": "왕자의 난 뒤 도성에는 형제의 피를 본 정안군을 두고 흉흉한 소문이 돈다. 백성의 마음을 붙잡아야 한다. (가상 사건)", "V14": "세자 방석과 방번을 잃은 태상왕 태조는 이방원에게 크게 노했다. 아버지의 노여움은 곧 정통성의 그림자가 된다. (가상 사건)", "V15": "넷째 형 방간 쪽 사람들이 정안군에게 줄을 대려 한다. 포섭하면 힘이 되지만, 언제 등을 돌릴지 모른다. (가상 사건)", "V16": "사헌부가 공신들이 토지와 노비를 빼앗는다며 탄핵 상소를 올렸다. 공신을 지킬지, 법을 세울지 정해야 한다. (가상 사건)", "20": "1401년 태종은 제2차 왕자의 난과 즉위에 공을 세운 이들을 좌명공신으로 책록했다. 하륜, 이숙번 등이 이름을 올렸다.", "21": "1401년 사섬서를 두고 이듬해 1402년 종이 화폐 저화를 발행했다. 백성들이 쌀과 베를 더 믿어 유통은 순조롭지 않았다.", "22": "1402년(태종 2) 정월, 조선에서 처음으로 정식 무과가 시행되었다. 사병 대신 나라가 무인을 길러 쓰는 길이 열렸다.", "23": "1403년 주자소를 설치하고 구리 활자 계미자를 만들었다. 책을 널리 찍어 유학을 퍼뜨리려는 뜻이었다.", "24": "태종은 1405년 도읍을 다시 한양으로 옮기고 새 궁궐 창덕궁을 지었다. 이후 한양은 조선의 도읍으로 굳어졌다.", "25": "1413년 지방 행정 구역의 이름과 체계를 고쳤고, 1417년 황해도·함경도로 개칭하며 8도 체제가 자리 잡았다. 왕이 지방을 직접 다스리는 틀이 마련되었다.", "26": "『태종실록』에 따르면 1413년 태종은 임진나루에서 거북선과 왜선이 싸우는 모습을 구경했다. 1415년에는 거북선을 더 튼튼하게 만들자는 건의가 올라왔다.", "27": "1414년, 양인 아버지와 노비 어머니 사이의 자식을 아버지 신분을 따라 양인으로 삼는 종부법을 시행했다. 나라의 역을 질 양인을 늘리려는 정책이었다.", "28": "1415년 서선이 종친과 관리들의 서얼 자손에게 높은 벼슬을 주지 말자고 건의했다. 이는 훗날 서얼을 차별하는 법의 출발점이 되었다.", "29": "민무구·민무질에 이어 1415년 남은 처남 민무휼·민무회도 불충을 이유로 서인이 되었고, 이듬해 1416년 사사되었다. 외척의 힘은 크게 꺾였다.", "30": "왕자의 난의 공신 이숙번은 공을 믿고 교만해졌다. 태종은 1415년 그를 조정에서 내쫓아 지방으로 보냈다.", "31": "1419년(세종 1), 상왕 태종의 주도로 이종무가 이끄는 군대가 왜구의 근거지 대마도를 쳤다(기해동정). 왕위를 물려준 뒤에도 군사권은 상왕에게 있었다.", "V17": "도성에 역병이 돌아 사람들이 쓰러진다. 약과 의원을 보낼지, 성문을 닫아 번지는 것을 막을지 정해야 한다. (가상 사건)", "V18": "도성에 큰불이 나 민가 수백 채가 탔다. 집 잃은 백성을 돌보지 않으면 원망이 왕에게 향한다. (가상 사건)", "V19": "어느 고을 수령이 세금을 가로채고 백성을 괴롭힌다는 고발이 올라왔다. 그는 공신의 친척이다. (가상 사건)", "V20": "왕자의 혼인은 곧 정치다. 어느 집안과 사돈을 맺느냐에 따라 조정의 힘이 바뀐다. (가상 사건)", "V21": "명 사신이 와서 머문다. 접대가 소홀하면 황제에게 나쁜 말이 들어가고, 지나치면 나라 곳간이 빈다. (가상 사건)", "V22": "여진 부족들이 말과 모피를 곡식과 바꾸자며 국경 시장을 열어 달라고 한다. 교역은 이익이지만 국경을 느슨하게 한다. (가상 사건)", "V23": "왕이 사냥 중 말에서 떨어지고는 사관에게 알리지 말라 했다는 이야기처럼, 사관은 왕의 일거수일투족을 적는다. 기록을 막으려 하면 신하들이 반발한다. (가상 사건)","1": "1398년, 정도전·남은 등이 요동 정벌을 내세워 왕자들의 사병을 거두려 하고 세자 방석을 앞세웠다. 이방원은 먼저 군사를 일으켜 정도전 일파와 세자 방석·방번을 제거했다.", "2": "난을 일으킨 직후 이방원은 스스로 세자가 되지 않고 둘째 형 방과를 세자로 세웠다. 태조가 물러나자 방과가 즉위하니 그가 정종이다. 실권은 여전히 정안군에게 있었다.", "3": "1400년, 넷째 형 방간이 박포의 부추김을 받아 개경에서 군사를 일으켰다. 이방원의 군사가 이를 진압했고, 방간은 죽이지 않고 유배를 보냈다.", "4": "제2차 왕자의 난 직후 1400년, 종친과 공신이 거느리던 사병을 모두 혁파해 삼군부에 귀속시켰다. 사사로운 무력이 사라지며 왕권의 바탕이 마련되었다.", "5": "1400년 11월, 정종이 동생 이방원에게 왕위를 물려주니 조선 제3대 국왕 태종이다. 피로 얻은 자리였기에 정통성을 다지는 일이 남았다.", "V1": "정도전 일파는 무너졌지만 그를 따르던 자들이 아직 도성에 숨어 있다는 소문이 돈다. 밀서가 오간다는 첩보를 어떻게 다룰지 정해야 한다. (가상 사건)", "V2": "왕자의 난에서 공을 세운 공신들이 더 큰 상과 벼슬을 바라고 있다. 달래자니 나라 곳간이, 누르자니 그들의 칼이 걱정이다. (가상 사건)", "V3": "정종은 왕위가 부담스러웠지만 쉽게 물러날 결심을 하지 못한다. 동생에게 선위할 명분과 시기를 놓고 조정이 술렁인다. (가상 사건)", "V4": "사병 혁파 명령이 내려졌지만 오랫동안 군사를 거느려 온 장수들이 쉽게 따르지 않는다. 회유할지 힘으로 누를지 정해야 한다. (가상 사건)", "T1": "무시해 둔 정도전 잔당이 무리를 모아 밤길에 습격을 벌였다. 지금이라도 막지 않으면 혼란이 번진다. (가상 토큰 사건)", "6": "태조는 왕자의 난 뒤 고향 함흥으로 떠나 돌아오지 않았다. 태종이 보낸 차사들이 돌아오지 못했다는 이야기는 전승이며, 태조는 1402년 무렵 한양으로 돌아왔다.", "7": "1402년, 안변부사 조사의가 신덕왕후 강씨의 원수를 갚는다며 동북면에서 군사를 일으켰다. 태상왕 태조와 연결되었다는 의심을 받았고, 관군이 진압했다.", "8": "1401년, 억울한 일을 당한 백성이 대궐 밖 북을 쳐 직접 왕에게 호소하도록 신문고를 설치했다. 실제로는 절차가 까다로워 널리 쓰이지는 못했다.", "9": "1403년, 명 영락제가 태종을 조선 국왕으로 인정하는 고명과 인신을 보내왔다. 대외적으로 왕위의 정당성이 확인된 순간이었다.", "10": "1406년, 전국의 사찰을 정리해 일부만 남기고 그 토지와 노비를 국가로 거두었다. 숭유억불을 실행하며 나라 재정을 넓혔다.", "11": "1406년 태종이 세자에게 왕위를 물려주겠다고 하자, 왕비의 동생 민무구·민무질이 기뻐한 기색을 보였다는 탄핵이 일어났다. 두 사람은 유배되었다가 1410년 자결을 명받았다.", "12": "1413년, 16세 이상 남자에게 신분과 이름을 적은 호패를 차게 했다. 인구와 군역 자원을 파악하려는 제도였지만 백성의 반발과 도피도 컸다.", "13": "1414년, 6조가 의정부를 거치지 않고 왕에게 직접 보고하고 명을 받도록 했다. 재상의 권한이 줄고 왕권이 강해졌다.", "14": "세자 양녕대군의 잦은 비행 끝에 1418년 태종은 세자를 폐하고 셋째 충녕대군을 세자로 세웠다. 두 달 뒤 왕위를 물려주니 그가 세종이다.", "15": "세종이 즉위한 1418년, 상왕 태종은 세종의 장인 심온이 권세를 키울 것을 경계했다. 심온은 옥사에 연루되어 사사되었다.", "V5": "오랜 가뭄으로 곡식이 말라 백성이 굶주린다. 옛사람들은 하늘의 재앙을 임금의 덕과 연결해 보았다. (가상 사건)", "V6": "고려 말부터 이어진 왜구가 남쪽 해안을 노략질한다. 수군을 보내 바닷길을 지켜야 한다. (가상 사건 · 태종 대 왜구 침입은 실제로 잦았다)", "V7": "두만강 너머 여진 부족들이 국경을 넘어와 약탈과 교역을 오간다. 군사로 누를지 벼슬과 물자로 달랠지 정해야 한다. (가상 사건)", "V8": "명 사신이 금은과 공녀 등 무리한 공물을 요구한다. 들어주면 백성이 고달프고, 거절하면 황제의 의심을 산다. (가상 사건)", "V9": "사간원·사헌부의 대간들이 왕의 처사를 비판하는 상소를 잇달아 올린다. 받아들이면 시간이 들고, 묵살하면 신하들의 마음이 떠난다. (가상 사건)", "V10": "세자가 학문을 멀리하고 궐 밖에서 사냥과 유흥을 즐긴다는 보고가 올라온다. 꾸짖어 바로잡을지, 내버려 둘지 정해야 한다. (가상 사건)", "V11": "왕비 집안 민씨 형제의 집 앞에 벼슬을 사려는 자들이 줄을 섰다는 소문이 돈다. 외척의 힘이 커질수록 이런 일이 늘어난다. (가상 사건)", "V12": "누군가 밤중에 찾아와 역모를 고했다. 진짜인지 모함인지 알 수 없으니, 조사하든 바로 처단하든 대가가 따른다. (가상 사건)", "T2": "선위 파동 때 봐준 민씨 형제가 끝내 군사를 모았다. 외척의 칼이 왕실을 겨눈다. (가상 토큰 사건)", "T3": "요구를 거절당한 명 사신이 황제에게 조선을 비난하는 보고를 올렸다. 해명 사신을 보내야 한다. (가상 토큰 사건)"};
const PRO={"prologue": ["14세기 말, 고려는 안으로는 권문세족의 토지 독점과 불교 사원의 폐단, 밖으로는 홍건적과 왜구의 침입으로 무너져 가고 있었다. 전쟁 영웅으로 떠오른 이성계는 1388년 위화도에서 군사를 돌려 권력을 잡고, 신진 사대부와 손잡고 과전법 등 개혁을 밀어붙였다.", "1392년, 이성계는 왕위에 올라 새 왕조를 열었고 이듬해 국호를 조선으로 정했다. 새 나라의 설계자는 정도전이었다. 그는 재상이 중심이 되어 나라를 다스리는 정치를 꿈꾸며 한양 천도와 제도 정비를 이끌었다.", "같은 해, 태조는 첫째 부인 신의왕후 한씨의 아들들을 제치고 둘째 부인 신덕왕후 강씨가 낳은 막내 방석을 세자로 세웠다. 정몽주를 제거하는 등 건국에 큰 공을 세운 다섯째 아들 정안군 이방원은 개국공신에서도 빠지고 세자 자리에서도 밀려났다.", "1398년, 정도전은 요동 정벌을 내세워 왕자들과 공신들이 거느린 사병을 거두려 한다. 군사를 잃으면 정안군의 목숨도 장담할 수 없다. 태조는 병석에 누워 있고, 도성에는 긴장이 감돈다.", "당신은 이방원이다. 1383년 문과에 급제한 젊은 문신으로 시작해(서막), 먼저 칼을 뽑아 살아남고, 왕위에 올라 흔들리는 정통성을 바로 세우라. 그리고 공신·외척·종친·사대부의 힘을 다스려, 다음 왕에게 안정된 나라를 물려주어야 한다. 1418년 왕위를 넘기는 날, 역사가 당신을 평가할 것이다."], "act1": "1막 · 왕자의 난 (1398~1400) — 정도전과 세자 방석이 사병을 거두려 한다. 살아남아 형 방과(정종)를 세우고, 사병을 혁파한 뒤 마침내 즉위하라.", "act2": "2막 · 왕의 시대 (1400~1418) — 왕위에 올랐지만 아버지 태조는 등을 돌렸고, 공신과 외척은 커져만 간다. 명의 인정을 받고 제도를 다져, 세자 문제를 매듭짓고 다음 왕에게 나라를 물려주라.", "act0": "서막 · 고려의 황혼 (1383~1398) — 젊은 문신 이방원은 과거에 급제하고, 아버지 이성계의 곁에서 새 왕조가 열리는 것을 지켜본다. 공을 세우고도 밀려난 왕자는 1398년, 사병을 빼앗길 위기에 선다."};

function rnd(n){const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}

 b:{1:new Audio("bgm/act1_taiko.mp3"),2:new Audio("bgm/act2_court.mp3")},
 save(){localStorage.setItem("tj_audio",JSON.stringify(this.cfg))},
 sfx(n){if(this.cfg.sfxM||!this.unlocked)return;const a=new Audio("sfx/"+n+".mp3");a.volume=this.cfg.sfxV;a.play().catch(()=>{})},
 vol(){return this.cfg.bgmM?0:this.cfg.bgmV},
 bgm(act){if(!this.unlocked)return;const nx=this.b[act];if(this.cur===nx){nx.volume=this.vol();return}
  const old=this.cur;this.cur=nx;nx.loop=true;nx.volume=0;nx.play().catch(()=>{});let k=0;
  const iv=setInterval(()=>{k++;const p=Math.min(1,k/30);nx.volume=this.vol()*p;if(old)old.volume=this.vol()*(1-p);if(p>=1){clearInterval(iv);if(old)old.pause()}},66)},
 unlock(){if(this.unlocked)return;this.unlocked=true;this.bgm(S&&S.act==2?2:1)}};

 for(const c of S.row){S.worse.push(c);log(`악화: ${C[base(c.id)].t}`);AU.sfx("penalty")}S.row=[];
 const n=(S.round==1||S.round==-2)?3:2;for(let i=0;i<n;i++){const id=draw();if(id){S.row.push(inst(id));log("공개: "+C[base(id)].t)}}
 for(const t of S.tokNext){S.row.push(inst(t));log("토큰 공개: "+C[t].t)}S.tokNext=[];
 S.actLeft=(S.act==0?2:S.act==1?3:3+(has("왕의 권위")?1:0))-S.actMinus;S.actMinus=0;S.actLeft=Math.max(0,S.actLeft);

 const keep=[];for(const c of S.worse){const b=base(c.id);

function score(){const bal=F.filter(f=>S.fac[f]>=2&&S.fac[f]<=4).length;const b=bal+(bal==4?2:0);
 const tot=S.후계+S.민심+S.정통성+S.tab.length+b;const g=tot>=62?"성군의 시대":tot>=56?"안정된 계승":tot>=49?"불안한 계승":"왕조의 위기";return{tot,b,g}}

function effCost(c,oi){const d=C[base(c.id)],o=d.o[oi];let k=Object.assign({},o[1]!=null?o[1]:d.cost||{});
 const notes=[];if(has("정안군의 사병")&&S.act==1&&k.무력){k.무력--;notes.push("정안군의 사병 무력-1")}
 const tg=d.tags||"";const gen=[];if(tg.includes("종친")&&has("형제의 칼"))gen.push("형제의 칼");if(tg.includes("지방 반란")&&has("동북면 평정"))gen.push("동북면 평정");
 if(tg.includes("외교")&&has("사대의 명분"))gen.push("사대의 명분");if(tg.includes("외교")&&has("황제를 만난 왕자"))gen.push("황제를 만난 왕자");
 for(const t of["실전의 감각","무과 출신"])if((tg.includes("왜구")||tg.includes("지방 반란"))&&has(t))gen.push(t);
 if(tg.includes("재해")&&has("8도 관찰사"))gen.push("8도 관찰사");if(tg.includes("왜구")&&has("거북선"))gen.push("거북선");if(base(c.id)=="5"&&has("세자의 자리"))gen.push("세자의 자리");if(tg.includes("왜구")&&has("수군 강화"))gen.push("수군 강화");
 for(const g of gen){const r=R.filter(r=>k[r]>0).sort((a,b)=>k[b]-k[a])[0];if(r){k[r]--;notes.push(g+" "+r+"-1")}}
 if(base(c.id)=="14"&&oi==0&&S.pye){const m=Math.min(S.pye,k.명분||0);k.명분-=m;if(m)notes.push(`세자 방치 명분-${m}`)}
 if(S.blood&&k.무력){const m=Math.min(2,k.무력);k.무력-=m;notes.push(`피의 결단 무력-${m}`)}
 const bid=base(c.id);for(const ch of CH){if(!chOn(ch.id,3)||!ch.cards.includes(bid))continue;
  if(ch.id=="P8"&&oi!=0)continue;
  const r=ch.red[0]=="*"?R.filter(r=>k[r]>0).sort((a,b)=>k[b]-k[a])[0]:ch.red.find(r=>k[r]>0);if(r){k[r]--;notes.push(`${ch.t} ${r}-1`)}}
 let extra=S.worse.some(w=>w.u==c.u)?1:0;
 if(bid=="11"&&chOn("P4",5)){extra++;notes.push("민제(외척5+) +1")}if(bid=="V11"&&chOn("P5",5)){extra++;notes.push("민무구(외척5+) +1")}

function canPay(e,ex){const r=Object.assign({},S.res);for(const x in e.k)r[x]-=e.k[x];if(R.some(x=>r[x]<0))return false;if(e.extra){if(!ex||r[ex]<e.extra)return false}return true}

const HARSH=["색출","처단","처형","진압","기습","위협","토벌","처벌"],LOW=["무시","방치","봐주기","덮어줌","두기","묵살"];
function resolve(u,oi,ex){const c=S.row.concat(S.worse).find(x=>x.u==u);if(!c||S.over)return;const e=effCost(c,oi);

 log(`해결: ${d.t} — ${o[0]} (${o[2]})`);

  else if(k=="ACTM")S.actMinus+=v;else if(k=="PYE")S.pye+=v;else if(k=="DICE")dice=v;else add(k,v)}

 ${d.tech?`<div class="tech"><b>기술 · ${d.tech[0]}</b><br>${d.tech[1]}</div>`:""}</div>`;
 const ok=condOK(c);if(!ok)h+=`<p class="fail">조건 미충족: ${condText(c)}</p>`;
 const act=S.actLeft>0||S.free>0;if(!act)h+=`<p class="fail">남은 행동이 없습니다.</p>`;
 d.o.forEach((o,i)=>{const e=effCost(c,i);let exSel="";let ex=null;
  if(e.extra){const r2=Object.assign({},S.res);for(const x in e.k)r2[x]-=e.k[x];ex=R.filter(r=>r2[r]>=e.extra).sort((a,b)=>r2[b]-r2[a])[0]||"무력";
   exSel=`<div>추가 자원: <select id="ex${i}">${R.map(r=>`<option ${r==ex?"selected":""}>${r}</option>`).join("")}</select></div>`}
  const pay=canPay(e,ex);
  h+=`<div class="opt"><b>◆ ${o[0]}</b> — ${o[2]}<div>실제 비용: ${chips(e.k,e.extra)}</div>${e.notes.length?`<small>${e.notes.join(", ")}</small>`:""}${exSel}
  <button class="btn" data-opt="${i}" ${(!pay||!ok||!act||S.over)?"disabled":""} onclick="resolve(${u},${i},${e.extra?`$('ex${i}').value`:"null"})">${pay?"이 선택지로 해결":"자원 부족"}</button></div>`});
 if(w&&avail("물러서는 지혜")&&!["5","14"].includes(base(c.id))&&!c.hold)h+=`<button class="btn alt" onclick="hold(${u})">물러서는 지혜 사용 (1라운드 더 보류)</button>`;
 M(h+"</div>");AU.sfx("click")}
function hold(u){snap();const c=S.worse.find(x=>x.u==u);c.hold=true;S.used["물러서는 지혜"]=1;log("물러서는 지혜 사용: "+C[base(c.id)].t);save();closeM();render()}
const RV={무력:"mu",명분:"my",인맥:"in",재정:"je"};let JM=[];
function openJM(){JM=[];jmUI()}
function jmUI(){M(`<h3>정무 — 원하는 자원 2개 (행동 1, 같은 자원 가능)</h3><p>선택: ${JM.join(", ")||"-"} (${JM.length}/2)</p>`+R.map(r=>`<button class="btn" style="background:var(--${RV[r]})" onclick="jmAdd('${r}')">${r} +1</button>`).join(""))}

function incomeUI(){M(`<h3>라운드 수입: 원하는 자원 1개</h3><p class="note">재정 +1은 이미 받았습니다.</p>`+R.map(r=>`<button class="btn" style="background:var(--${RV[r]})" onclick="pickIncome('${r}')">${r} +1</button>`).join(""),true)}
function openTrade(){let h="<h3>교환 (행동 아님): 같은 자원 2 → 다른 자원 1</h3>";for(const a of R){h+=`<div>${a}(${S.res[a]}) 2개 → `+R.filter(b=>b!=a).map(b=>`<button class="btn" ${S.res[a]<2?"disabled":""} onclick="trade('${a}','${b}')">${b}</button>`).join("")+"</div>"}M(h)}
function useTech(n){snap();if(n=="밀정의 귀"){S.used[n]=1;const dk=deck();log("밀정의 귀 사용");save();render();M(`<h3>밀정의 귀</h3><p>덱 맨 위: <b>${dk[0]?C[base(dk[0])].t:"(없음)"}</b></p>`)}
 else if(n=="피의 결단"){S.used[n]=1;S.blood=1;log("피의 결단: 다음 해결의 무력 비용 최대 2 무시");save();render()}
 else if(n=="왕에게 곧바로"){S.used[n]=1;S.free++;log("왕에게 곧바로: 이번 해결 1회는 행동을 쓰지 않음 (행동 1로 2장)");save();render()}
 else if(n=="시험하는 왕"){U.pop();M("<h3>시험하는 왕: 세력 1칸 조정</h3>"+F.map(f=>`<div>${f} ${S.fac[f]} <button class="btn" onclick="sikum('${f}',-1)">−1</button><button class="btn" onclick="sikum('${f}',1)">+1</button></div>`).join(""))}}
function sikum(f,v){snap();S.used["시험하는 왕"]=1;S.fac[f]+=v;clamp();log(`시험하는 왕: ${f} ${v>0?"+":""}${v}`);save();closeM();render()}
function openAudio(){const c=AU.cfg;M(`<h3>소리 설정</h3>
<p>배경음악 <label><input type="checkbox" id="bm" ${c.bgmM?"checked":""}> 음소거</label><br><input type="range" id="bv" min="0" max="1" step="0.05" value="${c.bgmV}"></p>
<p>효과음 <label><input type="checkbox" id="sm" ${c.sfxM?"checked":""}> 음소거</label><br><input type="range" id="sv" min="0" max="1" step="0.05" value="${c.sfxV}"></p>`);
 const up=()=>{c.bgmM=$("bm").checked;c.bgmV=+$("bv").value;c.sfxM=$("sm").checked;c.sfxV=+$("sv").value;AU.save();if(AU.cur)AU.cur.volume=AU.vol()};
 ["bm","bv","sm","sv"].forEach(i=>$(i).oninput=up);$("sv").onchange=()=>AU.sfx("click")}
function openCredits(){M(`<h3>크레딧</h3><p><b>게임 디자인</b>: 《태종: 피로 세운 길》 프로토타입 v0.3</p>
<p><b>1막 BGM</b>: "Taiko drums (seamless loop)" — jobro (OpenGameArt 제출: congusbongus). 라이선스 <a href="https://creativecommons.org/licenses/by/3.0/">CC-BY 3.0</a>. 출처 <a href="https://opengameart.org/content/taiko-drums-seamless-loop">opengameart.org/content/taiko-drums-seamless-loop</a> (원본 freesound.org/people/jobro/sounds/112248). 96kbps MP3로 재인코딩.</p>
<p><b>2막 BGM</b>: "Asianoriental1" — Tozan. 라이선스 CC0. 출처 <a href="https://opengameart.org/content/asianoriental1">opengameart.org/content/asianoriental1</a>. 96kbps MP3로 재인코딩.</p>
<p><b>인물 카드</b>: 10장, 수치는 초안.</p><p><b>효과음</b>: numpy로 직접 합성 (sfxgen.py).</p>`)}
function openRules(){M(`<h3>규칙 요약</h3><ol style="font-size:13px"><li>서막(3라운드, 행동 2) → 1막 → 2막. 서막 덱 7장, 마지막은 「요동 정벌과 사병 혁파 압박」</li><li>수입: 재정 +1, 원하는 자원 +1</li><li>세력 수입(3 이상): 공신→무력 · 사대부→명분 · 종친→인맥 · 외척→재정</li><li>반란: 공신/외척 6이면 정통성 -1</li><li>기술 효과(매 라운드)</li><li>악화: 지난 라운드 미해결 사건 → 악화 칸 (비용 +1)</li><li>공개: 2장(1라운드 3장) + 토큰</li><li>행동: 해결 또는 정무(자원 2개) (1막 3 / 즉위 후 4)</li><li>정리: 악화 칸 미해결 버림 → 민심 -1, 정통성 -1</li></ol>
<p style="font-size:13px">교환(자유): 같은 자원 2 → 다른 자원 1. 패배: 민심 또는 정통성 0.<br>점수 = 후계 + 민심 + 정통성 + 진열대 카드 수 + 세력 균형(2~4 세력마다 +1, 넷 모두 +2 추가).<br>62+ 성군의 시대 · 56+ 안정된 계승 · 49+ 불안한 계승 · 그 미만 왕조의 위기.<br>즉위: 정통성 4↑, 버려지지 않음, 4라운드 이후 미해결 라운드 종료마다 정통성 -1. 폐세자: 정통성 5↑, 미해결 시 후계 -3. 함흥차사: 놓여 있는 동안 라운드 종료마다 정통성 -1.</p>`)}
function openPrologue(){M(`<h2>배경 — 피로 세운 길</h2>${PRO.prologue.map(p=>`<p style="font-size:14px;line-height:1.6">${p}</p>`).join("")}<p class="note">${PRO.act0}</p><button class="btn pri" id="proSkip" style="width:100%" onclick="closeM();if(S.act==0&&!S.introDone){S.introDone=1;actIntro(0)}else render()">시작하기 / 건너뛰기</button>`,true)}
function actIntro(a){M(`<h2 style="color:${["#4B2C6B","#8E2323","#1F3A68"][a]}">${a?a+"막":"서막"}</h2><p style="font-size:15px;line-height:1.6">${PRO["act"+a]}</p><button class="btn pri" id="actOK" style="width:100%" onclick="closeM();render()">계속</button>`,true)}
let INTRO=null;
function render(){const s=S;document.body.style.background=s.act==0?"#ebe4f0":s.act==1?"#efe3d9":"#e1e6ef";
 $("hdr").innerHTML=`<div class="row"><small style="opacity:.6">${VER}</small> <b style="color:${["#d3b8f0","#f2a3a3","#a9c4f2"][s.act]}">${s.act?s.act+"막":"서막"}</b>${trk("라운드",s.round<=0?"서막 "+(s.round+3)+"/3":s.round+"/12","round")}${trk("행동",s.actLeft+(s.free?`(+${s.free}무료)`:""),"act")}${trk("후계",s.후계,"후계")}${trk("민심",s.민심,"민심",s.민심<=2?"danger":"")}${trk("정통성",s.정통성,"정통성",s.정통성<=2?"danger":"")}</div>
 <div class="row" style="margin-top:3px">${R.map(r=>trk(r,s.res[r],r,"res c"+r)).join("")}</div><div class="row" style="margin-top:3px">${F.map(f=>trk(f,s.fac[f],f,s.fac[f]>=6?"danger":"")).join("")}</div>`;
 const dk=deck();
 $("status").innerHTML=`<span class="note">덱 남은 장: ${dk.length}${s.act<2?` · 다음 막 덱 ${(s.act==0?s.deck1:s.deck2).length}`:""}${has("백성의 목소리")?` · 백성의 목소리 — 다음 사건: <b>${dk[0]?C[base(dk[0])].t:"없음"}</b>`:""}${s.tokNext.length?` · 다음 라운드 토큰: ${s.tokNext.map(t=>C[t].t).join(", ")}`:""}${s.v3fail?` · 즉위 조건 +${s.v3fail}`:""}${s.pye?` · 충녕 책봉 비용 -${s.pye}`:""}${s.actMinus?` · 다음 라운드 행동 -${s.actMinus}`:""}${s.pendingAct2?" · <b>다음 라운드 2막</b>":""}</span>`;
 $("rowc").innerHTML=s.row.map(c=>cardHTML(c,false)).join("")||'<span class="note">없음</span>';
 $("worsec").innerHTML=s.worse.map(c=>cardHTML(c,true)).join("")||'<span class="note">없음</span>';
 $("chn").textContent=(s.chars||[]).length;
 $("chc").innerHTML=(s.chars||[]).map(id=>{const c=CH.find(x=>x.id==id),v=s.fac[c.f],nw=(s.newChars||[]).includes(id);
  return `<div class="card pc ${nw?"enter":""}" style="--c:#2F6F6A;--t:#ECF5F3;cursor:default" data-ch="${id}"><div class="ttl">${c.t}</div><small><span class="chip" style="background:${FC[c.f]}">${c.f} ${v}</span> ${c.fl}</small>
  <div class="${v>=3?"on":"off"}"><b>3+</b> ${c.e3}</div><div class="${v>=5?"on":"off"}"><b>5+</b> ${c.e5}</div></div>`}).join("")||'<span class="note">아직 없음</span>';
 s.newChars=[];
 $("tabn").textContent=s.tab.length;
 $("tabc").innerHTML=s.tab.map(id=>{const d=C[base(id)];if(!d.tech)return `<div class="tech" style="background:#fff">${d.t} <small>(기술 없음)</small></div>`;const n=d.tech[0],u=s.used[n];
  let b="";if(["밀정의 귀","왕에게 곧바로","시험하는 왕","피의 결단"].includes(n)&&!u)b=`<button class="btn" onclick="useTech('${n}')">사용</button>`;
  return `<div class="tech ${u?"used":""}"><b>${n}</b> <small>(${d.t})</small> ${AUTO[n]?'<span class="chip cany">자동</span>':'<span class="chip cany">수동</span>'}${ONCE[n]?(u?' <span class="chip cany">사용함</span>':' <span class="chip c재정">사용 가능</span>'):""}<br>${d.tech[1]}${b}</div>`}).join("")||'<span class="note">없음</span>';
 $("log").textContent=s.log.join("\n");
 const o=s.over;
 $("bar").innerHTML=o?`<button class="btn pri" onclick="showEnd()">결과 보기</button><button class="btn alt" onclick="openCredits()">크레딧</button><button class="btn alt" onclick="confirmNew()">새 게임</button>`:
 `<button class="btn" id="bJM" ${s.actLeft<1?"disabled":""} onclick="openJM()">정무</button><button class="btn" onclick="openTrade()">교환</button><button class="btn pri" id="bEnd" onclick="endRound()">라운드 종료</button><button class="btn alt" onclick="undo()" ${U.length?"":"disabled"}>되돌리기</button><button class="btn alt" onclick="document.body.classList.toggle('edit')">✎수정</button><button class="btn alt" onclick="openPrologue()">배경</button><button class="btn alt" onclick="openRules()">규칙</button><button class="btn alt" onclick="openAudio()">🔊</button><button class="btn alt" onclick="openCredits()">크레딧</button><button class="btn alt" onclick="confirmNew()">새 게임</button>`;
 if(o&&!$("modal").classList.contains("on"))showEnd();
 else if(INTRO=="pro"){INTRO=null;openPrologue()}
 else if(INTRO==2||INTRO==1){const a=INTRO;INTRO=null;actIntro(a)}
 else if(!o&&s.pickIncome&&!s.dice)incomeUI();}
function showEnd(){const o=S.over;if(o.lose){M(`<h2>왕조의 몰락</h2><p>민심 또는 정통성이 0이 되었습니다. (라운드 ${S.round})</p><button class="btn pri" onclick="newGame();closeM()">새 게임</button>`);return}
 if(o.stage=="simon"){const d=C["15"];M(`<div class="card" style="--c:#3A2A12;--t:#F7F1E3;cursor:default"><div class="ttl">보너스 · ${d.t} (1418)</div><p class="flav">${d.f}</p><p>${d.cond}</p></div>
 <button class="btn pri" id="simY" onclick="simon(true)">사사 — 외척 0, 민심 -2</button><button class="btn alt" id="simN" onclick="simon(false)">두기 — 변화 없음</button>`,true);return}
 if(o.stage=="tsu"){const d=C["31"];M(`<div class="card" style="--c:#3A2A12;--t:#F7F1E3;cursor:default"><div class="ttl">보너스 · ${d.t} (1419)</div><p class="flav">${d.f}</p><p style="font-size:13px">${DESC["31"]}</p><p>${d.cond}</p></div>
 <button class="btn pri" id="tsuY" onclick="tsu(true)">정벌 — 무력 3 소모, 민심 +1, 진열대 +1</button><button class="btn alt" id="tsuN" onclick="tsu(false)">두기</button>`,true);return}
 const sc=score();if(!o.snd){o.snd=1;AU.sfx(sc.tot>=25?"win":"lose")}
 M(`<h2>${sc.g}</h2><p>최종 점수 <b style="font-size:28px">${sc.tot}</b></p><p>후계 ${S.후계} + 민심 ${S.민심} + 정통성 ${S.정통성} + 진열대 ${S.tab.length} + 세력 균형 ${sc.b}</p><button class="btn pri" onclick="newGame();closeM()">새 게임</button>`)}
function confirmNew(){M(`<h3>새 게임을 시작할까요?</h3><p class="note">덱을 새로 섞습니다 (새 게임 = 새 순서).</p><button class="btn pri" id="newOK" onclick="newGame();closeM()">새 게임 시작</button>`)}
try{S=JSON.parse(localStorage.getItem("tj_save3"));uidc=S.uid||999}catch(e){S=null}
if(!S||!S.res)newGame();else{S.chars=S.chars||[];render()}
</script></body></html>
